services:
    app:
        build:
            context: ./docker/${PHP_VERSION:-8.5}
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                NODE_VERSION: '${NODE_VERSION:-24}'
                PHP_EXTENSIONS: '${PHP_EXTENSIONS:-}'
                COMPOSER_VERSION: '${COMPOSER_VERSION:-}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-80}:80'
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            SUPERVISOR_PHP_COMMAND: '/bin/sh -c "HOME=/home/sail composer install --no-interaction --prefer-dist && exec /usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80"'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - valkey
            - mailpit
        healthcheck:
            test:
                - CMD
                - curl
                - '-fsS'
                - '-o'
                - /dev/null
                - 'http://localhost/up'
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 300s
            start_interval: 2s
    mysql:
        image: 'mysql:${MYSQL_VERSION:-8.4}'
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${FORWARD_DB_PORT:-}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    valkey:
        image: 'valkey/valkey:${VALKEY_VERSION:-9}-alpine'
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${FORWARD_VALKEY_PORT:-}:6379'
        volumes:
            - 'sail-valkey:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - valkey-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:${MAILPIT_VERSION:-latest}'
        ports:
            - '${APP_BIND_ADDRESS:-127.0.0.1}:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-valkey:
        driver: local
